name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    # No `branches:` filter, for the reason ci.yml's trigger spells out: with
    # one, a stacked PR gets no security scanning at all. Unlike ci.yml and
    # e2e-tests.yml, nothing here is gated on `github.base_ref` — a single
    # analyze job is cheap enough to run on every PR base, and with no base
    # guard to re-evaluate there is nothing for `edited` to fix, so the
    # default type set stays. CodeQL is not a required status check.
  schedule:
    # Weekly baseline: catches new CodeQL query-pack advisories against
    # unchanged code, independent of the push/PR-triggered scans above.
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level floor; the analyze job restates contents:read (job-level
# permissions replace, not add to, this block) alongside the write scope
# github/codeql-action needs to upload results.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Required so the action can read check-run/workflow-run metadata when
      # triggered on a private repo; harmless no-op on a public one.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # No compilation step exists for this extraction mode -- CodeQL
          # parses JS/TS sources directly rather than needing a build.
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
