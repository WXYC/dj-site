name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    # No `branches:` filter — one gave #1219 a zero-CI merge. The shard matrix
    # still skips on a non-`main` base for cost, but the `E2E Tests` aggregator
    # below FAILS there instead of skipping, so the PR stays blocked rather
    # than arriving pre-satisfied at its retarget onto `main`. See ci.yml's
    # trigger for the full reasoning, including why `edited` is not in
    # `types:`.
  workflow_dispatch:
    inputs:
      backend_ref:
        description: 'Backend-Service branch or commit SHA (blank = BACKEND_PINNED_REF, default main)'
        required: false
        default: ''

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Backend-Service ref this suite runs against by default.
  #
  # Decision (#1088, acceptance criterion 3): this suite floats on Backend
  # `main`. The 2026-08-05 pin to ef60c249 (#1089) reopened the merge gate, but
  # a pin goes stale invisibly — within a week it was ten days behind the
  # Backend that production actually runs. The outage that motivated pinning
  # (WXYC/Backend-Service#1999: an email-config throw surfaced by the awaited
  # BS#1969 invite send in an environment with no SES) is fixed at the root,
  # and this env now declares EMAIL_ENABLED=false like every other Backend test
  # environment. The resolver below accepts a branch or a commit SHA, so a
  # future incident can re-pin deliberately with a one-line change here.
  BACKEND_PINNED_REF: main
  # Frontend configuration
  NEXT_PUBLIC_BACKEND_URL: http://localhost:8085
  NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:8084/auth
  NEXT_PUBLIC_DASHBOARD_HOME_PAGE: /dashboard/flowsheet
  NEXT_PUBLIC_VERSION: e2e
  NEXT_PUBLIC_DEFAULT_EXPERIENCE: modern
  NEXT_PUBLIC_ENABLED_EXPERIENCES: modern,classic
  NEXT_PUBLIC_ALLOW_EXPERIENCE_SWITCHING: "true"
  NEXT_PUBLIC_CATALOG_TRACK_SEARCH_UI_ENABLED: "true"
  NEXT_PUBLIC_FLOWSHEET_SSE_DASHBOARD_ENABLED: "true"
  NEXT_PUBLIC_FLOWSHEET_SSE_LIVE_VIEW_ENABLED: "true"
  # Build-time gate for the RFC 8628 QR sign-in method. Inlined into the
  # dj-site build, so it must be present here (the build-cache key hashes this
  # workflow file, so flipping it auto-invalidates the stale .next/ cache).
  # Required by e2e/tests/auth/qr-signin.spec.ts — without it the "Sign in with
  # a QR code" entry link never renders and the spec can't reach the QR stage.
  NEXT_PUBLIC_QR_LOGIN_ENABLED: "true"
  NEXT_PUBLIC_APP_ORGANIZATION: test-org
  SESSION_SECRET: e2e-secret-for-testing
  APP_ORGANIZATION_ID: test-org-id-0000000000000000001
  # E2E test config
  E2E_BASE_URL: http://localhost:3000
  # Backend service ports
  E2E_DB_PORT: 5434
  E2E_AUTH_PORT: 8084
  E2E_BACKEND_PORT: 8085
  # Postgres connection for the SSE E2E suite (e2e/helpers/pg-notify.ts).
  # Mirrors scripts/e2e-local.sh's exports and the postgres service config
  # above. Backend-Service's own .env (sourced inside the Backend track)
  # takes precedence in that subshell, so this only affects steps that
  # need direct DB access from the test runner.
  DB_HOST: localhost
  DB_PORT: "5434"
  DB_NAME: wxyc_db
  DB_USERNAME: wxyc_admin
  # Credentials for a Postgres container created and destroyed by this run, and
  # reachable only from it. Deliberately a literal and deliberately inert-looking:
  # a GitHub secret would be unavailable to fork PRs and would diverge from
  # docker-compose.e2e.yml, which has to create the database with the same value.
  # Keep it free of shell metacharacters — it is written into an env file below.
  DB_PASSWORD: 'e2e-throwaway-not-a-secret'

# Workflow-level GITHUB_TOKEN scope. No job in this file pushes code,
# comments on PRs, or creates releases; all writes to external services
# use their own non-GITHUB_TOKEN secrets. contents:read is the safe floor.
# packages:read is required to install Backend-Service@main, which pulls
# @wxyc/shared from npm.pkg.github.com during npm ci (see charset-corpus-drift.yml).
permissions:
  contents: read
  packages: read

jobs:
  # See ci.yml for the rationale on the changes-job pattern (issue #731).
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      app_source: ${{ steps.filter.outputs.app_source }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7

      - name: Filter
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            app_source:
              - 'app/**'
              - 'src/**'
              - 'lib/features/**'
              - 'lib/store.ts'
              - 'lib/hooks.ts'
              - 'e2e/**'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.*'
              - 'playwright.config.*'
              - '.github/workflows/e2e-tests.yml'

  # `base_ref == 'main'` is the cost control for the unfiltered trigger above:
  # each shard boots a Backend-Service and a mock tubafrenzy mirror, so
  # letting the matrix fire on every PR in a stacked chain multiplies the
  # most expensive thing this repo runs by the depth of the chain. Stacked
  # PRs get ci.yml's cheap jobs; they pick up E2E when their base retargets to
  # `main` and `edited` re-evaluates this guard.
  e2e:
    name: E2E Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: >-
      github.event_name != 'pull_request'
      || (needs.changes.outputs.app_source == 'true' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    # 20, not 15. The cap has to cover the slowest healthy shard, and "healthy"
    # spans a wider range than the old number assumed: in a single run, with all
    # four shards on identical cache state, `Build and start services` took 82s,
    # 123s, 129s and 740s. The 740s shard was not cold and not on a branch that
    # touches `package-lock.json` -- it just built nine times slower than its
    # siblings for reasons we cannot yet name. At 15 minutes that shard has
    # ~160s left for the tests and gets cancelled, and a cancelled shard reports
    # no failed step and no annotation, so it reads as an infrastructure shrug
    # rather than a signal.
    #
    # This is a bandaid over unexplained build variance, not a tuned number.
    # Raising it trades a slower kill on a genuinely hung shard for not paying a
    # full four-shard rerun every time the tail lands long. Narrowing the
    # variance itself is the real fix.
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:18.0-alpine
        env:
          POSTGRES_PASSWORD: 'e2e-throwaway-not-a-secret'
          POSTGRES_USER: wxyc_admin
          POSTGRES_DB: wxyc_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U wxyc_admin -d wxyc_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout dj-site
        uses: actions/checkout@v7
        with:
          path: dj-site

      - name: Resolve Backend-Service ref
        id: backend-ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BACKEND_REF: ${{ github.event.inputs.backend_ref }}
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Accepts a branch name OR a commit SHA. The branch lookup used to be the
          # whole check, so a SHA fell through to the fallback and the run tested
          # something other than what it named — while still printing a ref line
          # that looked deliberate. A pinned SHA cannot work without this.
          resolve() {
            gh api "repos/${OWNER}/Backend-Service/git/ref/heads/$1" >/dev/null 2>&1 && return 0
            gh api "repos/${OWNER}/Backend-Service/commits/$1" >/dev/null 2>&1 && return 0
            return 1
          }

          REF="$INPUT_BACKEND_REF"
          if [ -z "$REF" ] && [ "$EVENT_NAME" = "pull_request" ]; then
            # Paired-branch convention: a same-named Backend-Service branch is used
            # when one exists, so a cross-repo change can be tested as a unit.
            REF="$HEAD_REF"
          fi

          if [ -n "$REF" ] && resolve "$REF"; then
            echo "ref=${REF}" >> "$GITHUB_OUTPUT"
            echo "Using Backend-Service ref: ${REF}"
            exit 0
          fi

          # An explicit request that does not resolve is a mistake, not a cue to
          # test something else. Failing here is what makes a bisection trustworthy.
          if [ -n "$INPUT_BACKEND_REF" ]; then
            echo "::error::backend_ref '${INPUT_BACKEND_REF}' is not a branch or commit in ${OWNER}/Backend-Service."
            exit 1
          fi

          if ! resolve "$BACKEND_PINNED_REF"; then
            echo "::error::BACKEND_PINNED_REF '${BACKEND_PINNED_REF}' is not a branch or commit in ${OWNER}/Backend-Service."
            exit 1
          fi
          echo "ref=${BACKEND_PINNED_REF}" >> "$GITHUB_OUTPUT"
          echo "Using Backend-Service ref: ${BACKEND_PINNED_REF} (default)"

      - name: Checkout Backend-Service
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/Backend-Service
          ref: ${{ steps.backend-ref.outputs.ref }}
          path: Backend-Service
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            dj-site/package-lock.json
            Backend-Service/package-lock.json

      - name: Create Backend .env file
        working-directory: Backend-Service
        run: |
          cat > .env << 'EOF'
          DB_HOST=localhost
          DB_PORT=5434
          DB_NAME=wxyc_db
          DB_USERNAME=wxyc_admin
          DB_PASSWORD='e2e-throwaway-not-a-secret'
          BETTER_AUTH_SECRET=e2e-auth-secret-for-testing-min-32-chars
          BETTER_AUTH_URL=http://localhost:8084/auth
          BETTER_AUTH_JWKS_URL=http://localhost:8084/auth/jwks
          BETTER_AUTH_TRUSTED_ORIGINS=http://localhost:3000,http://localhost:3001
          FRONTEND_SOURCE=http://localhost:3000
          DEFAULT_ORG_SLUG=test-org
          DEFAULT_ORG_NAME='Test Organization'
          APP_ORGANIZATION_ID=test-org-id-0000000000000000001
          E2E_DB_PORT=5434
          E2E_AUTH_PORT=8084
          E2E_BACKEND_PORT=8085
          COOKIE_SAME_SITE=lax
          NODE_ENV=test
          # This environment sends no email and sets no SES vars. Backend's
          # senders no-op only when email is declared disabled — enabled (the
          # unset default) plus missing SES config is a loud throw by design.
          # Every other Backend test environment sets this; without it, the
          # awaited account-setup invite send reports emailSent:false on every
          # provision and the roster UI warns instead of confirming, failing
          # each admin spec at its create-account step (#1088 / BS#1999).
          EMAIL_ENABLED=false
          # Mirror target: localhost mock that returns 200 to every POST,
          # short-circuiting the 15.5s exponential-backoff retry storm that
          # the default (https://www.wxyc.info, currently cert-expired) would
          # produce. Mock is started in the next workflow step. See #567.
          TUBAFRENZY_URL=http://localhost:9091
          MIRROR_API_KEY=e2e-mirror-noop-key
          # CDC LISTEN is gated on CDC_SECRET in setupCdcWebSocket(). The
          # SSE Tier 1 metadata-broadcast handler (setupMetadataBroadcast)
          # registers on the same LISTEN — so without this, pg_notify is
          # silently dropped. Tracked as a Backend-Service follow-up.
          CDC_SECRET=e2e-cdc-secret-not-used-by-tests
          # Tier 3 refetch test triggers liveFs:refetch by posting to
          # POST /internal/flowsheet-sync-notify with X-Internal-Key.
          ETL_NOTIFY_KEY=e2e-etl-notify-key
          EOF

      - name: Start mock tubafrenzy mirror
        working-directory: dj-site
        run: |
          node e2e/scripts/mock-tubafrenzy.mjs > /tmp/mock-tubafrenzy.log 2>&1 &
          echo $! > /tmp/mock-tubafrenzy.pid
          # Wait for the mock to bind before any later step expects it to
          # answer. ~50ms in practice; cap at 5s as a safety net.
          timeout 5 bash -c 'until curl -sf -X POST -H "Content-Type: application/json" --data "{}" http://localhost:9091/ >/dev/null; do sleep 0.1; done'
          echo "Mock tubafrenzy ready"

      # Read the RESOLVED version out of the lockfile rather than the `^1.62.1`
      # range in package.json: the range is stable across the patch bumps that
      # actually change the browser build, so keying on it would serve stale
      # binaries. `-re` makes jq exit non-zero if the path is missing, which
      # fails this step loudly — an empty version would collapse every
      # Playwright release into one cache entry, the exact hazard this avoids.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          set -euo pipefail
          version=$(jq -re '.packages["node_modules/@playwright/test"].version' dj-site/package-lock.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved @playwright/test $version"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the Playwright version, NOT the whole lockfile hash. The
          # browser binaries depend on the Playwright release and nothing else,
          # so hashing the entire dependency graph meant one unrelated
          # devDependency bump re-downloaded Chromium on all four shards at
          # once -- which, combined with a simultaneously-cold Next build, is
          # what pushed shards past the job timeout.
          #
          # No `restore-keys` here on purpose. A partial restore would leave a
          # browser set from a different release in place, and the install step
          # below skips work on `cache-hit == 'true'`, which is only set by an
          # EXACT key match. Adding restore-keys would therefore never save the
          # install anyway, and would only make what is on disk harder to
          # reason about. A version change should download; that is correct.
          key: playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install dependencies
        env:
          # GITHUB_TOKEN + packages:read installs @wxyc/shared from GitHub
          # Packages on same-repo workflows. Fork-originated PRs cannot access
          # repo secrets at all — this swap does not change that; it matches
          # charset-corpus-drift.yml for in-repo PR/push runs.
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd Backend-Service && npm ci) &
          PID_BS=$!
          (cd dj-site && npm ci) &
          PID_DJ=$!
          wait $PID_BS || exit 1
          wait $PID_DJ || exit 1

      - name: Cache dj-site build
        id: nextjs-build-cache
        uses: actions/cache@v6
        with:
          path: dj-site/.next
          # Workflow file hash is included because the env block (NEXT_PUBLIC_*)
          # is inlined into the Next.js build; flipping a flag without invalidating
          # the cache would silently serve a stale build.
          key: e2e-nextjs-${{ hashFiles('dj-site/package-lock.json') }}-${{ hashFiles('dj-site/next.config.*') }}-${{ hashFiles('dj-site/.github/workflows/e2e-tests.yml') }}-${{ hashFiles('dj-site/app/**', 'dj-site/src/**', 'dj-site/lib/**') }}
          restore-keys: |
            e2e-nextjs-${{ hashFiles('dj-site/package-lock.json') }}-${{ hashFiles('dj-site/next.config.*') }}-${{ hashFiles('dj-site/.github/workflows/e2e-tests.yml') }}-
            e2e-nextjs-${{ hashFiles('dj-site/package-lock.json') }}-${{ hashFiles('dj-site/next.config.*') }}-
            e2e-nextjs-${{ hashFiles('dj-site/package-lock.json') }}-

      - name: Build and start services
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXTJS_BUILD_CACHE_HIT: ${{ steps.nextjs-build-cache.outputs.cache-hit }}
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          # Backend track: build -> init-db -> start services -> seed users
          (
            cd Backend-Service

            # Export all .env vars so they're available at module-import time
            # (shared/authentication checks BETTER_AUTH_JWKS_URL before dotenv loads)
            set -a; source .env; set +a

            npm run build
            node dev_env/init-db.mjs

            # Start auth service
            AUTH_PORT=8084 node apps/auth/dist/app.js > /tmp/auth.log 2>&1 &
            echo $! > /tmp/auth.pid
            echo "Waiting for auth service..."
            timeout 60 bash -c 'until curl -sf http://localhost:8084/healthcheck; do sleep 1; done'

            # Start backend service (PORT and auth issuer/audience not in .env)
            PORT=8085 \
            BETTER_AUTH_ISSUER=http://localhost:8084 \
            BETTER_AUTH_AUDIENCE=http://localhost:8084 \
            node apps/backend/dist/app.js > /tmp/backend.log 2>&1 &
            echo $! > /tmp/backend.pid
            echo "Waiting for backend service..."
            timeout 60 bash -c 'until curl -sf http://localhost:8085/healthcheck; do sleep 1; done'

            # Seed E2E test users
            npm run setup:e2e-users
          ) &
          PID_BACKEND=$!

          # Playwright track: skip install if browser binary is already cached.
          # On cache hit the binary exists at ~/.cache/ms-playwright. The --with-deps
          # flag installs system fonts via apt-get (~25s); ubuntu-latest already has
          # the critical system libraries Chromium needs (libX11, libnss3, etc.).
          if [ "$PLAYWRIGHT_CACHE_HIT" = "true" ]; then
            echo "Playwright browser cache hit — skipping install"
          else
            (cd dj-site && npx playwright install --with-deps chromium) &
            PID_PW=$!
          fi

          # dj-site build track: skip if exact cache hit on .next/
          if [ "$NEXTJS_BUILD_CACHE_HIT" = "true" ]; then
            echo "dj-site build cache hit — skipping build"
          else
            (cd dj-site && npm run build) &
            PID_BUILD=$!
          fi

          # Wait for parallel tracks — fail if any fails
          wait $PID_BACKEND || exit 1
          if [ -n "$PID_PW" ]; then wait $PID_PW || exit 1; fi
          if [ -n "$PID_BUILD" ]; then wait $PID_BUILD || exit 1; fi

          # Second dj-site build for e2e/tests/auth/server-session-via-docker.spec.ts.
          # NEXT_PUBLIC_BETTER_AUTH_URL is inlined at build time to an unreachable
          # loopback address, simulating the Docker scenario where the container's
          # `localhost` is the container itself. AUTH_REWRITE_URL is set at runtime
          # on the second `npm run start` (in the Start dj-site step) and is what
          # the test asserts gets picked up. Writes to `.next-broken-auth/` via
          # NEXT_DIST_DIR_SUFFIX in next.config.mjs so the primary `.next/` cache
          # survives. Runs AFTER the primary build, not in parallel: both builds
          # bootstrap OpenNext (initOpenNextCloudflareForDev in next.config.mjs)
          # against a shared workerd SQLite cache and both trigger Next's
          # tsconfig.json typegen rewrite — running them concurrently races on
          # those shared files and crashes with SQLITE_BUSY. Not cached
          # separately to keep cache-key logic simple.
          (cd dj-site && \
            NEXT_PUBLIC_BETTER_AUTH_URL=http://127.0.0.99:9999/auth \
            NEXT_DIST_DIR_SUFFIX=broken-auth \
            npm run build) || exit 1

      - name: Start dj-site
        working-directory: dj-site
        run: |
          npm run start > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid

          # Wait for frontend to be ready
          echo "Waiting for frontend..."
          timeout 60 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done'

          # Second dj-site instance for the server-session-via-docker test
          # (built earlier with NEXT_PUBLIC_BETTER_AUTH_URL pointing at an
          # unreachable host). NEXT_DIST_DIR_SUFFIX=broken-auth selects the
          # `.next-broken-auth/` build at runtime. AUTH_REWRITE_URL points at
          # the real auth so it wins over the unreachable build-inlined
          # NEXT_PUBLIC_BETTER_AUTH_URL in both getBaseURL() and the /auth
          # route handler — the precedence the test asserts.
          PORT=3001 \
            NEXT_DIST_DIR_SUFFIX=broken-auth \
            AUTH_REWRITE_URL=http://localhost:8084/auth \
            npm run start \
            > /tmp/frontend-broken-auth.log 2>&1 &
          echo $! > /tmp/frontend-broken-auth.pid
          echo "Waiting for second frontend..."
          timeout 60 bash -c 'until curl -sf http://localhost:3001; do sleep 2; done'

      - name: Run E2E tests
        working-directory: dj-site
        env:
          SECOND_FRONTEND_PORT: "3001"
          # Tier 3 refetch test posts directly to BS's internal route.
          E2E_BACKEND_URL: "http://localhost:8085"
          ETL_NOTIFY_KEY: "e2e-etl-notify-key"
        # --max-failures kept at 10 per shard: with sharding, a stuck shard
        # hits its cap on its own, so dropping to 1 tanks otherwise-green
        # shards (see prior commit on #574).
        run: |
          npm run test:e2e -- \
            "--shard=${{ matrix.shard }}/${{ strategy.job-total }}" \
            "--max-failures=10" \
            "--reporter=html" \
            "--reporter=github"

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Auth Service Logs ==="
          cat /tmp/auth.log 2>/dev/null || echo "No auth log"
          echo ""
          echo "=== Backend Service Logs ==="
          cat /tmp/backend.log 2>/dev/null || echo "No backend log"
          echo ""
          echo "=== Frontend Logs ==="
          cat /tmp/frontend.log 2>/dev/null || echo "No frontend log"
          echo ""
          echo "=== Frontend (broken-auth) Logs ==="
          cat /tmp/frontend-broken-auth.log 2>/dev/null || echo "No frontend-broken-auth log"
          echo ""
          echo "=== Mock Tubafrenzy Logs ==="
          cat /tmp/mock-tubafrenzy.log 2>/dev/null || echo "No mock-tubafrenzy log"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: dj-site/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: dj-site/test-results/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          kill $(cat /tmp/frontend.pid 2>/dev/null) 2>/dev/null || true
          kill $(cat /tmp/frontend-broken-auth.pid 2>/dev/null) 2>/dev/null || true
          kill $(cat /tmp/auth.pid 2>/dev/null) 2>/dev/null || true
          kill $(cat /tmp/backend.pid 2>/dev/null) 2>/dev/null || true
          kill $(cat /tmp/mock-tubafrenzy.pid 2>/dev/null) 2>/dev/null || true

  # e2e/tests/flowsheet/go-live-takeover.spec.ts in its own job, on its own
  # Backend-Service, running the dedicated `chromium-takeover` Playwright
  # project (see e2e/playwright.config.ts) with --workers=1.
  #
  # Three things the sharded matrix above cannot give this spec:
  #   1. FLOWSHEET_TAKEOVER_ENABLED=true. Off, `POST /flowsheet/join` ignores
  #      `intent` and co-hosts every collision — the pre-#2233 behavior this
  #      spec exists to pin against regressing. The matrix's Backend runs
  #      with the flag unset (default false) on purpose: those specs rely on
  #      the OLD silent co-host to coexist with sibling workers sharing one
  #      Backend (see flowsheet.page.ts's answerHandoffPromptIfShown).
  #   2. A Backend-Service nobody else's tests touch. This spec is the only
  #      one in the suite allowed to click "End Existing Show" — on the
  #      shared matrix Backend, two workers within a shard share one process,
  #      and a takeover would end a sibling worker's show mid-test.
  #   3. `workers=1`. `mode: "serial"` inside the spec only serializes within
  #      its own describe block; `fullyParallel: true` plus more than one
  #      worker would still let Playwright schedule this file's tests
  #      alongside a second run of itself (e.g. a retry) or interleave with
  #      whatever else the project matches.
  e2e-takeover:
    name: E2E Tests (go-live takeover)
    needs: changes
    if: >-
      github.event_name != 'pull_request'
      || (needs.changes.outputs.app_source == 'true' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    # 20, matching the sharded job, for the same reason its own cap documents:
    # `Build and start services` has been observed at 82s, 123s, 129s and 740s
    # in a single run on identical cache state. This job is structurally more
    # exposed than that, not less — its build cache key and every restore-key
    # carry an `e2e-takeover-` prefix, so it can never fall back to the sharded
    # job's entry and pays a full Next build on each new branch. A cancel here
    # now fails `e2e-all`, so an infrastructure shrug would read as a red
    # required check.
    timeout-minutes: 20
    env:
      # Publishes the `chromium-takeover` Playwright project (and the setup
      # steps that provision its two identities). Unset everywhere else, so no
      # unscoped run — the sharded matrix, `npm run test:e2e`, a bare
      # `npx playwright test` — can schedule the one spec that clicks "End
      # Existing Show" onto a Backend-Service it doesn't own.
      E2E_TAKEOVER_PROJECT: "1"

    services:
      postgres:
        image: postgres:18.0-alpine
        env:
          # Deliberately inert-looking, and deliberately free of shell
          # metacharacters: this value is written into an env file below, and
          # `$1100` in the older literal is a positional-parameter expansion
          # that anything sourcing that file would read as `100`. This job
          # provisions its own Postgres here rather than through
          # docker-compose.e2e.yml, so the only requirement is that this and
          # the heredoc's DB_PASSWORD agree with each other.
          POSTGRES_PASSWORD: e2e-throwaway-not-a-secret
          POSTGRES_USER: wxyc_admin
          POSTGRES_DB: wxyc_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U wxyc_admin -d wxyc_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout dj-site
        uses: actions/checkout@v7
        with:
          path: dj-site

      # Same paired-branch convention as the sharded job above: a
      # same-named Backend-Service branch is used when one exists, so a
      # cross-repo change can be tested as a unit. FLOWSHEET_TAKEOVER_ENABLED
      # itself needs no pairing — the gate it guards shipped to Backend
      # `main` ahead of this spec — but the resolver is shared so this job
      # doesn't silently drift onto a different Backend ref than its sibling.
      - name: Resolve Backend-Service ref
        id: backend-ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BACKEND_REF: ${{ github.event.inputs.backend_ref }}
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          resolve() {
            gh api "repos/${OWNER}/Backend-Service/git/ref/heads/$1" >/dev/null 2>&1 && return 0
            gh api "repos/${OWNER}/Backend-Service/commits/$1" >/dev/null 2>&1 && return 0
            return 1
          }

          REF="$INPUT_BACKEND_REF"
          if [ -z "$REF" ] && [ "$EVENT_NAME" = "pull_request" ]; then
            REF="$HEAD_REF"
          fi

          if [ -n "$REF" ] && resolve "$REF"; then
            echo "ref=${REF}" >> "$GITHUB_OUTPUT"
            echo "Using Backend-Service ref: ${REF}"
            exit 0
          fi

          if [ -n "$INPUT_BACKEND_REF" ]; then
            echo "::error::backend_ref '${INPUT_BACKEND_REF}' is not a branch or commit in ${OWNER}/Backend-Service."
            exit 1
          fi

          if ! resolve "$BACKEND_PINNED_REF"; then
            echo "::error::BACKEND_PINNED_REF '${BACKEND_PINNED_REF}' is not a branch or commit in ${OWNER}/Backend-Service."
            exit 1
          fi
          echo "ref=${BACKEND_PINNED_REF}" >> "$GITHUB_OUTPUT"
          echo "Using Backend-Service ref: ${BACKEND_PINNED_REF} (default)"

      - name: Checkout Backend-Service
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/Backend-Service
          ref: ${{ steps.backend-ref.outputs.ref }}
          path: Backend-Service
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            dj-site/package-lock.json
            Backend-Service/package-lock.json

      - name: Create Backend .env file
        working-directory: Backend-Service
        run: |
          cat > .env << 'EOF'
          DB_HOST=localhost
          DB_PORT=5434
          DB_NAME=wxyc_db
          DB_USERNAME=wxyc_admin
          DB_PASSWORD=e2e-throwaway-not-a-secret
          BETTER_AUTH_SECRET=e2e-auth-secret-for-testing-min-32-chars
          BETTER_AUTH_URL=http://localhost:8084/auth
          BETTER_AUTH_JWKS_URL=http://localhost:8084/auth/jwks
          BETTER_AUTH_TRUSTED_ORIGINS=http://localhost:3000,http://localhost:3001
          FRONTEND_SOURCE=http://localhost:3000
          DEFAULT_ORG_SLUG=test-org
          DEFAULT_ORG_NAME='Test Organization'
          APP_ORGANIZATION_ID=test-org-id-0000000000000000001
          E2E_DB_PORT=5434
          E2E_AUTH_PORT=8084
          E2E_BACKEND_PORT=8085
          COOKIE_SAME_SITE=lax
          NODE_ENV=test
          EMAIL_ENABLED=false
          TUBAFRENZY_URL=http://localhost:9091
          MIRROR_API_KEY=e2e-mirror-noop-key
          CDC_SECRET=e2e-cdc-secret-not-used-by-tests
          ETL_NOTIFY_KEY=e2e-etl-notify-key
          # The one line this job exists to set. Must land in THIS heredoc —
          # the Backend-Service process reads its config from .env, not from
          # this workflow's top-level `env:` block, which never reaches a
          # child process spawned by `node apps/backend/dist/app.js`. Without
          # it the join route silently ignores `intent` and co-hosts every
          # collision: the client's handoff prompt (go-live-takeover.spec.ts
          # beat 2) would still render — its pre-check is flag-independent —
          # but beats 3-5 would exercise no server routing at all, and the
          # spec would pass while testing nothing.
          FLOWSHEET_TAKEOVER_ENABLED=true
          EOF

      - name: Start mock tubafrenzy mirror
        working-directory: dj-site
        run: |
          node e2e/scripts/mock-tubafrenzy.mjs > /tmp/mock-tubafrenzy.log 2>&1 &
          echo $! > /tmp/mock-tubafrenzy.pid
          timeout 5 bash -c 'until curl -sf -X POST -H "Content-Type: application/json" --data "{}" http://localhost:9091/ >/dev/null; do sleep 0.1; done'
          echo "Mock tubafrenzy ready"

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          set -euo pipefail
          version=$(jq -re '.packages["node_modules/@playwright/test"].version' dj-site/package-lock.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved @playwright/test $version"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install dependencies
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd Backend-Service && npm ci) &
          PID_BS=$!
          (cd dj-site && npm ci) &
          PID_DJ=$!
          wait $PID_BS || exit 1
          wait $PID_DJ || exit 1

      - name: Cache dj-site build
        id: nextjs-build-cache
        uses: actions/cache@v6
        with:
          path: dj-site/.next
          # Own key, distinct from the sharded job's cache: both jobs build
          # from identical inputs (same workflow-level env, same source), so
          # the ONLY reason not to share the sharded job's key is that two
          # jobs in the same workflow run would race a write to it. A
          # redundant build costs about a minute; a torn cache entry is a
          # worse trade.
          key: e2e-takeover-nextjs-${{ hashFiles('dj-site/package-lock.json') }}-${{ hashFiles('dj-site/next.config.*') }}-${{ hashFiles('dj-site/.github/workflows/e2e-tests.yml') }}-${{ hashFiles('dj-site/app/**', 'dj-site/src/**', 'dj-site/lib/**') }}
          restore-keys: |
            e2e-takeover-nextjs-${{ hashFiles('dj-site/package-lock.json') }}-${{ hashFiles('dj-site/next.config.*') }}-${{ hashFiles('dj-site/.github/workflows/e2e-tests.yml') }}-
            e2e-takeover-nextjs-${{ hashFiles('dj-site/package-lock.json') }}-${{ hashFiles('dj-site/next.config.*') }}-
            e2e-takeover-nextjs-${{ hashFiles('dj-site/package-lock.json') }}-

      - name: Build and start services
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXTJS_BUILD_CACHE_HIT: ${{ steps.nextjs-build-cache.outputs.cache-hit }}
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          (
            cd Backend-Service
            set -a; source .env; set +a

            npm run build
            node dev_env/init-db.mjs

            AUTH_PORT=8084 node apps/auth/dist/app.js > /tmp/auth.log 2>&1 &
            echo $! > /tmp/auth.pid
            echo "Waiting for auth service..."
            timeout 60 bash -c 'until curl -sf http://localhost:8084/healthcheck; do sleep 1; done'

            PORT=8085 \
            BETTER_AUTH_ISSUER=http://localhost:8084 \
            BETTER_AUTH_AUDIENCE=http://localhost:8084 \
            node apps/backend/dist/app.js > /tmp/backend.log 2>&1 &
            echo $! > /tmp/backend.pid
            echo "Waiting for backend service..."
            timeout 60 bash -c 'until curl -sf http://localhost:8085/healthcheck; do sleep 1; done'

            npm run setup:e2e-users
          ) &
          PID_BACKEND=$!

          if [ "$PLAYWRIGHT_CACHE_HIT" = "true" ]; then
            echo "Playwright browser cache hit — skipping install"
          else
            (cd dj-site && npx playwright install --with-deps chromium) &
            PID_PW=$!
          fi

          # No broken-auth second build here — that build exists solely for
          # e2e/tests/auth/server-session-via-docker.spec.ts, which this
          # job's `chromium-takeover` project doesn't match.
          if [ "$NEXTJS_BUILD_CACHE_HIT" = "true" ]; then
            echo "dj-site build cache hit — skipping build"
          else
            (cd dj-site && npm run build) &
            PID_BUILD=$!
          fi

          wait $PID_BACKEND || exit 1
          if [ -n "$PID_PW" ]; then wait $PID_PW || exit 1; fi
          if [ -n "$PID_BUILD" ]; then wait $PID_BUILD || exit 1; fi

      - name: Start dj-site
        working-directory: dj-site
        run: |
          npm run start > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid
          echo "Waiting for frontend..."
          timeout 60 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done'

      - name: Run go-live takeover E2E spec
        working-directory: dj-site
        run: |
          npm run test:e2e -- \
            "--project=chromium-takeover" \
            "--workers=1" \
            "--reporter=html" \
            "--reporter=github"

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Auth Service Logs ==="
          cat /tmp/auth.log 2>/dev/null || echo "No auth log"
          echo ""
          echo "=== Backend Service Logs ==="
          cat /tmp/backend.log 2>/dev/null || echo "No backend log"
          echo ""
          echo "=== Frontend Logs ==="
          cat /tmp/frontend.log 2>/dev/null || echo "No frontend log"
          echo ""
          echo "=== Mock Tubafrenzy Logs ==="
          cat /tmp/mock-tubafrenzy.log 2>/dev/null || echo "No mock-tubafrenzy log"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-takeover
          path: dj-site/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-takeover
          path: dj-site/test-results/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          kill $(cat /tmp/frontend.pid 2>/dev/null) 2>/dev/null || true
          kill $(cat /tmp/auth.pid 2>/dev/null) 2>/dev/null || true
          kill $(cat /tmp/backend.pid 2>/dev/null) 2>/dev/null || true
          kill $(cat /tmp/mock-tubafrenzy.pid 2>/dev/null) 2>/dev/null || true

  # Single stable check for branch protection. With the matrix above, individual
  # shard jobs are named "E2E Tests (shard N/M)" — that name shifts if we ever
  # change the shard count. This aggregator stays "E2E Tests" so the required-
  # status-check rule doesn't need touching.
  #
  # `skipped` is treated as success because both e2e and e2e-takeover are
  # gated by the `changes` job's path filter (issue #731). On a PR that
  # doesn't touch app source, both skip and we should pass — not fail — so
  # workflow-only PRs can satisfy the required check.
  #
  # That skipped->success mapping is also why a non-`main` base has to be
  # FAILED here rather than skipped, and why this job stays ungated so it can
  # do the failing. Both jobs skip on a stacked PR to avoid booting five
  # backends for a base that isn't shipping — but if this aggregator skipped
  # too, "E2E Tests" would sit satisfied on a PR that ran zero shards, and
  # GitHub's automatic retarget onto `main` when the parent merges would hand
  # that satisfied state straight to branch protection. Failing keeps the PR
  # blocked until the suite actually runs against `main`.
  e2e-all:
    name: E2E Tests
    needs: [e2e, e2e-takeover]
    if: always()
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
      MATRIX_RESULT: ${{ needs.e2e.result }}
      TAKEOVER_RESULT: ${{ needs.e2e-takeover.result }}
    steps:
      - name: Verify all shards and the takeover job passed
        run: |
          # `github.base_ref` is empty on `push`; the event-name check is what
          # keeps a push to `main` from failing on "" != "main".
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ] && [ "$BASE_REF" != "main" ]; then
            echo "::error::E2E is not run for a PR based on '${BASE_REF}'. Retarget onto main, then push a commit (an empty one is enough) or close and reopen the PR. A workflow re-run will NOT clear this — it replays the original event, base branch included."
            exit 1
          fi

          case "$MATRIX_RESULT" in
            success|skipped)
              echo "E2E matrix result: ${MATRIX_RESULT}"
              ;;
            *)
              echo "One or more E2E shards failed: ${MATRIX_RESULT}"
              exit 1
              ;;
          esac

          case "$TAKEOVER_RESULT" in
            success|skipped)
              echo "E2E takeover job result: ${TAKEOVER_RESULT}"
              ;;
            *)
              echo "The go-live takeover E2E job failed: ${TAKEOVER_RESULT}"
              exit 1
              ;;
          esac
