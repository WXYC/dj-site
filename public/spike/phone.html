<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Phone lock test</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #f6f6f4;
        --text: #1c1c1c;
        --muted: #5f5f5f;
        --line: #d9d9d4;
        --accent: #1f5fbf;
        --on-accent: #ffffff;
        --good: #1e7a3c;
        --bad: #b3261e;
        --warn: #8a5a00;
        color-scheme: light dark;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --text: #ececec;
          --muted: #a5a5a5;
          --line: #3a3a3a;
          --accent: #7aa7ff;
          --on-accent: #0d1a30;
          --good: #7ed69a;
          --bad: #ff8a80;
          --warn: #e7b85c;
        }
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font: 18px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow-x: hidden;
      }

      main {
        max-width: 560px;
        margin: 0 auto;
      }

      .lead {
        margin: 0 0 16px;
        font-size: 30px;
        font-weight: 700;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .lead[data-result="pass"] {
        color: var(--good);
      }

      .lead[data-result="fail"] {
        color: var(--bad);
      }

      .lead[data-result="cant"] {
        color: var(--warn);
      }

      .sub {
        margin: 0 0 24px;
        font-size: 20px;
        overflow-wrap: anywhere;
      }

      .start {
        display: block;
        width: 100%;
        min-height: 40vh;
        border: 0;
        border-radius: 24px;
        background: var(--accent);
        color: var(--on-accent);
        font: inherit;
        font-size: 56px;
        font-weight: 800;
        cursor: pointer;
      }

      .start:disabled {
        opacity: 0.4;
      }

      table {
        width: 100%;
        margin: 0 0 24px;
        border-collapse: collapse;
        font-size: 16px;
      }

      td {
        padding: 10px 4px;
        border-top: 1px solid var(--line);
        vertical-align: top;
        overflow-wrap: anywhere;
      }

      td.mark {
        width: 1.6em;
        font-weight: 800;
      }

      td.mark[data-result="pass"] {
        color: var(--good);
      }

      td.mark[data-result="fail"] {
        color: var(--bad);
      }

      td.mark[data-result="cant"] {
        color: var(--warn);
      }

      .detail {
        display: block;
        color: var(--muted);
        font-size: 14px;
      }

      .sent {
        margin: 0 0 16px;
        font-size: 22px;
        font-weight: 700;
      }

      .sent[data-state="ok"] {
        color: var(--good);
      }

      .sent[data-state="bad"] {
        color: var(--bad);
      }

      .copy {
        width: 100%;
        min-height: 56px;
        margin: 0 0 16px;
        border: 2px solid var(--accent);
        border-radius: 14px;
        background: transparent;
        color: var(--accent);
        font: inherit;
        font-weight: 700;
      }

      textarea {
        width: 100%;
        height: 160px;
        margin: 0 0 16px;
        font: 12px ui-monospace, Menlo, monospace;
      }

      .foot {
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 13px;
        overflow-wrap: anywhere;
      }
    </style>
    <script src="/spike/lock-math.js" defer></script>
    <script src="/spike/phone-math.js" defer></script>
    <script src="/spike/phone.js" defer></script>
  </head>
  <body>
    <main>
      <p id="lead" class="lead" data-testid="lead" aria-live="polite">Getting ready…</p>
      <p id="sub" class="sub" data-testid="sub"></p>
      <button id="start" type="button" class="start" data-testid="start" hidden disabled>Start</button>
      <table id="checks" data-testid="checks" hidden>
        <tbody></tbody>
      </table>
      <p id="sent" class="sent" data-testid="sent" role="status" hidden></p>
      <button id="copy" type="button" class="copy" data-testid="copy" hidden>Copy results</button>
      <textarea id="copy-out" readonly hidden></textarea>
      <p id="foot" class="foot" data-testid="foot"></p>
    </main>
    <audio id="audio" preload="none" data-testid="audio"></audio>
  </body>
</html>
