services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      # Throwaway container, torn down with the test run. Must stay byte-identical
      # to DB_PASSWORD in .github/workflows/e2e-tests.yml and scripts/e2e-local.sh —
      # this is the value the database is created with, those are what connect to it.
      POSTGRES_PASSWORD: 'e2e-throwaway-not-a-secret'
      POSTGRES_USER: wxyc_admin
      POSTGRES_DB: wxyc_db
    ports:
      - "${E2E_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wxyc_admin", "-d", "wxyc_db"]
      interval: 5s
      timeout: 5s
      retries: 5
